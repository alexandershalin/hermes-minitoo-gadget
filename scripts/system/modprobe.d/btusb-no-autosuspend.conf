# /etc/modprobe.d/btusb-no-autosuspend.conf — USB autosuspend для Bluetooth-адаптеров btusb выключен.
#
# Что: параметр модуля btusb enable_autosuspend=0.
# Зачем: btusb при КАЖДОМ probe (загрузка, переподключение USB, сброс адаптера) сам
# включает autosuspend, если параметр равен Y (по умолчанию так собрано ядро Ubuntu,
# CONFIG_BT_HCIBTUSB_AUTOSUSPEND). Поэтому ручное `echo on > .../power/control`
# слетает. Усыпление адаптера рвёт/задерживает связь с колонкой (HANDOFF §5.7).
# Действует на все btusb-адаптеры этого компьютера; цена — 1-2 Вт энергосбережения.
#
# Нужен root; ставит владелец сам (не через бота):
#   sudo install -m 644 ~/hermes-minitoo-gadget/scripts/system/modprobe.d/btusb-no-autosuspend.conf /etc/modprobe.d/
#   sudo update-initramfs -u      # на случай, если btusb грузится из initramfs
#   перезагрузка (или, когда колонка не нужна: sudo modprobe -r btusb && sudo modprobe btusb —
#   Bluetooth пропадёт на несколько секунд)
# Проверка:
#   cat /sys/module/btusb/parameters/enable_autosuspend      # ожидается N
#   bash ~/hermes-minitoo-gadget/scripts/diag/bt-health.sh   # раздел autosuspend: control=on
# Откат:
#   sudo rm /etc/modprobe.d/btusb-no-autosuspend.conf && sudo update-initramfs -u && перезагрузка
options btusb enable_autosuspend=0
