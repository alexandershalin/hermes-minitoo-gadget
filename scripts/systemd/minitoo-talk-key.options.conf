# Опции поведения talk-key (drop-in, ставится как ~/.config/systemd/user/minitoo-talk-key.service.d/10-options.conf).
# Описание каждой опции: докстринг в начале scripts/minitoo-talk-key.py
[Service]
# Остановка записи кнопкой колонки в режиме HFP (AT+CHUP), иначе кнопка в записи не видна
Environment=MINITOO_HFP_KEYS=1
# Адаптивный порог VAD и потолок порога
Environment=MINITOO_VAD_ADAPTIVE=1
Environment=MINITOO_VAD_CEILING=600
# 0 = не проигрывать подсказку «Говорите» (экран Listening и так показывается)
Environment=MINITOO_SPEAK_PROMPT=0
# Джойстик в простое: влево = cancel (дважды за 1 с = новая сессия), вправо = up (последний ответ)
Environment=MINITOO_SCROLL_KEYS=1
# joystick_guard бесполезен: вправо/вверх в записи дают только AT+CHUP без события перед ней (docs/KNOWN_ISSUES.md)
#Environment=MINITOO_JOYSTICK_GUARD=1
