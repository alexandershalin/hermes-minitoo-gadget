# 60-minitoo-hfp-at-log.conf — постоянно писать в журнал INFO-строки темы spa.bluez5.native.
#
# Что: WirePlumber по умолчанию пропускает в журнал только уровень N (notice) и выше.
# AT-команды гарнитуры, на которые PipeWire без модема ответить не может (AT+CHUP,
# AT+BVRA, ATA, AT+CKPD, AT+BLDN, ...), он отмечает строкой уровня INFO
#   spa.bluez5.native: RFCOMM receive command but modem not available: AT+CHUP
# и сейчас она теряется. Вероятно, именно так приходит Play/Pause во время записи
# (HANDOFF §5.1): колонка думает, что идёт звонок, и шлёт «положить трубку».
# Фрагмент поднимает до INFO только эту одну тему. Поштучного лога пакетов в ней нет,
# так что журнал не забивается (флуд дают spa.bluez5.sco-io / source / sink и общий D).
# Колонке ничего не отправляется, ответы PipeWire не меняются.
#
# Установка (без root):
#   mkdir -p ~/.config/wireplumber/wireplumber.conf.d
#   cp ~/hermes-minitoo-gadget/scripts/wireplumber/60-minitoo-hfp-at-log.conf ~/.config/wireplumber/wireplumber.conf.d/
#   systemctl --user restart wireplumber   # один раз; звук колонки пропадёт на несколько секунд
# То же без перезапуска, до следующего рестарта WirePlumber:
#   wpctl set-log-level "N,spa.bluez5.native:I"
# Важно:
#   * фрагмент не действует, если у WirePlumber задана WIREPLUMBER_DEBUG — проверка:
#       systemctl --user show wireplumber -p Environment; systemctl --user show-environment | grep WIREPLUMBER_DEBUG
#   * после диагностики возвращать уровень ТОЛЬКО той же строкой:
#       wpctl set-log-level "N,spa.bluez5.native:I"
#     или удалением файла с рестартом. НЕ «wpctl set-log-level -»: эта команда стирает и
#     шаблон из этого файла, до следующего перезапуска WirePlumber AT-строк снова не будет.
# Проверка (после нажатия Play/Pause во время записи):
#   journalctl --user -u wireplumber --since -10min -o short-precise TOPIC=spa.bluez5.native
# Откат:
#   rm ~/.config/wireplumber/wireplumber.conf.d/60-minitoo-hfp-at-log.conf && systemctl --user restart wireplumber
context.properties = {
  log.level = "N,spa.bluez5.native:I"
}
